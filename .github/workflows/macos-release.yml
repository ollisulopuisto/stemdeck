name: macOS Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (vMAJOR.MINOR.PATCH); macOS only, draft release"
        required: true
        default: "v0.20.1"
      architectures:
        description: "Architectures to build (Intel dependencies currently unavailable)"
        type: choice
        options: [arm64, both]
        default: arm64
  pull_request:
    paths:
      - ".github/workflows/macos-release.yml"
      - "scripts/macos/make-app.sh"
      - "scripts/macos/make-dmg.sh"
      - "scripts/macos/notarize.sh"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notarization-preflight:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check release credentials without exposing values
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_ID APPLE_APP_PASSWORD BUILD_CERTIFICATE_BASE64 P12_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing release secret: $name"
              missing=1
            fi
          done
          test "$missing" = 0
          bash -n scripts/macos/make-app.sh scripts/macos/make-dmg.sh scripts/macos/notarize.sh

  build-and-upload:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: notarization-preflight
    # Standard hosted Apple Silicon runner, free for this public repository.
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      APPLE_SIGNING_IDENTITY: "Developer ID Application: Olli Sulopuisto (LWSR8T5392)"
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: "LWSR8T5392"
      STEMDECK_NOTARIZE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: clean workspace
        run: rm -rf .build dist

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: prepare hosted toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install uv zstd
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: verify notarization credentials
        run: |
          if [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_PASSWORD:-}" ]; then
            echo "ERROR: APPLE_ID and APPLE_APP_PASSWORD secrets must be set on this repo for a release build." >&2
            echo "Refusing to publish an unnotarized release." >&2
            exit 1
          fi

      - name: write version files
        env:
          # github.ref_name (evaluated by Actions) instead of $GITHUB_REF_NAME,
          # which is only injected by runner >= 2.290 — empty on older
          # self-hosted runners.
          REF_NAME: ${{ inputs.version || github.ref_name }}
        run: |
          if [ -z "${REF_NAME:-}" ]; then
            echo "REF_NAME is not set" >&2
            exit 1
          fi
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          VERSION="${REF_NAME#v}"
          printf '{ "version": "%s" }\n' "$VERSION" > static/version.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" desktop/src-tauri/Cargo.toml
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" desktop/src-tauri/tauri.conf.json
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" desktop/package.json
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Wrote version $VERSION to all version files"

      # Use a throwaway keychain and put the runner's keychain
      # search list back afterwards, so nothing persists between runs.
      - name: import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          tmp="${RUNNER_TEMP:-$(mktemp -d)}"
          cert="$tmp/build_certificate.p12"
          keychain="$tmp/stemdeck-signing.keychain-db"
          security list-keychains -d user | tr -d '"' > "$tmp/keychains.orig"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$cert"
          export KEYCHAIN_PATH="$keychain" CERTIFICATE_PATH="$cert"
          export KEYCHAIN_PASSWORD="$KEYCHAIN_PASSWORD" P12_PASSWORD="$P12_PASSWORD"
          python3 scripts/macos_ci_credentials.py import-certificate
          rm -f "$cert"
          security list-keychains -d user -s "$keychain" $(cat "$tmp/keychains.orig")
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"

      - name: build macOS arm64
        env:
          SSL_CERT_FILE: /etc/ssl/cert.pem
          REQUESTS_CA_BUNDLE: /etc/ssl/cert.pem
        run: |
          command -v zstd
          command -v uv >/dev/null 2>&1 || brew install uv
          uv python install cpython-3.12-macos-aarch64-none
          ARM64_PYTHON="$(uv python find cpython-3.12-macos-aarch64-none)"
          scripts/macos/make-iconset.sh
          ARCH=arm64 VERSION="$VERSION" PYTHON_BIN="$ARM64_PYTHON" scripts/macos/make-runtime-pack.sh
          ARCH=arm64 VERSION="$VERSION" scripts/macos/make-app.sh
          ARCH=arm64 VERSION="$VERSION" scripts/macos/make-dmg.sh

      - name: build macOS x64
        if: github.event_name != 'workflow_dispatch' || inputs.architectures == 'both'
        env:
          SSL_CERT_FILE: /etc/ssl/cert.pem
          REQUESTS_CA_BUNDLE: /etc/ssl/cert.pem
        run: |
          command -v zstd
          if ! arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            echo "ERROR: Rosetta 2 is required to build the x64 runtime on this agent." >&2
            exit 1
          fi
          rustup default stable
          rustup target add x86_64-apple-darwin
          command -v uv >/dev/null 2>&1 || brew install uv
          uv python install cpython-3.12-macos-x86_64-none
          X64_PYTHON="$(uv python find cpython-3.12-macos-x86_64-none)"
          ARCH=x64 VERSION="$VERSION" PYTHON_BIN="$X64_PYTHON" scripts/macos/make-runtime-pack.sh
          ARCH=x64 VERSION="$VERSION" scripts/macos/make-app.sh
          ARCH=x64 VERSION="$VERSION" scripts/macos/make-dmg.sh

      - name: inspect artifacts
        run: |
          test -f .build/macos-dist/StemDeck-macOS-arm64.dmg
          test -f .build/StemDeck-runtime-macOS-arm64.tar.zst
          test -f .build/macos-dist/SHA256SUMS-macOS-arm64.txt
          archs="arm64"
          if [[ "${{ github.event_name }}" != workflow_dispatch || "${{ inputs.architectures }}" == both ]]; then
            archs="arm64 x64"
          fi
          for arch in $archs; do
            test -f ".build/macos-dist/StemDeck-macOS-$arch.dmg"
            test -f ".build/StemDeck-runtime-macOS-$arch.tar.zst"
            test -f ".build/macos-dist/SHA256SUMS-macOS-$arch.txt"
            cat ".build/macos-dist/SHA256SUMS-macOS-$arch.txt"
          done
          if find desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/StemDeck.app \
            \( -iname '*python*' -o -iname '*torch*' -o -iname '*ffmpeg*' -o -iname '*ffprobe*' \) |
            grep -q .; then
            echo "arm64 StemDeck.app contains runtime binaries that should stay outside the DMG." >&2
            exit 1
          fi
          for arch in $archs; do
            mountpoint="$(mktemp -d /tmp/stemdeck-dmg.XXXXXX)"
            hdiutil attach ".build/macos-dist/StemDeck-macOS-$arch.dmg" -readonly -nobrowse -mountpoint "$mountpoint"
            trap 'hdiutil detach "$mountpoint" >/dev/null 2>&1 || true; rmdir "$mountpoint" >/dev/null 2>&1 || true' EXIT
            test -d "$mountpoint/StemDeck.app"
            codesign --verify --strict --deep "$mountpoint/StemDeck.app"
            spctl --assess --type execute --verbose=2 "$mountpoint/StemDeck.app"
            expected=arm64
            [[ "$arch" != x64 ]] || expected=x86_64
            lipo "$mountpoint/StemDeck.app/Contents/MacOS/stemdeck" -verify_arch "$expected"
            if find "$mountpoint/StemDeck.app" \( -iname '*python*' -o -iname '*torch*' -o -iname '*ffmpeg*' -o -iname '*ffprobe*' \) | grep -q .; then
              echo "Runtime binary found inside app" >&2
              exit 1
            fi
            test -L "$mountpoint/Applications"
            test -f "$mountpoint/README-macOS.txt"
            test -f "$mountpoint/THIRD_PARTY_NOTICES.txt"
            hdiutil detach "$mountpoint"
            rmdir "$mountpoint"
            trap - EXIT
          done

      - name: remove signing keychain
        if: always()
        run: |
          tmp="${RUNNER_TEMP:-}"
          [ -n "$tmp" ] || exit 0
          if [ -s "$tmp/keychains.orig" ]; then
            security list-keychains -d user -s $(cat "$tmp/keychains.orig") || true
          fi
          rm -f "$tmp/build_certificate.p12"
          security delete-keychain "$tmp/stemdeck-signing.keychain-db" || true

      - name: upload artifacts
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          # Carry the release's own flag. The action defaults `prerelease` to
          # false and writes it back, so attaching assets silently promoted a
          # pre-release to the latest release -- which also fires `released`,
          # pushing :latest to GHCR, and makes the in-app updater offer a build
          # that was never verified.
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ github.event.release.prerelease || false }}
          files: |
            .build/macos-dist/StemDeck-macOS-*.dmg
            .build/StemDeck-runtime-macOS-*.tar.zst
            .build/macos-dist/SHA256SUMS-macOS-*.txt
